<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox Tata Surya</title>
<style>
  :root {
    --ink: #0d1230; --panel: #161c45; --slot: #131943; --line: #343d78;
    --chalk: #edf1ff; --muted: #9aa5d6; --sun: #ffb43b; --ok: #4fe0a8; --bad: #ff6b7f; --focus: #8ab4ff; --cyan: #5fd6e8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; color: var(--chalk); background: var(--ink); line-height: 1.45;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Trebuchet MS", system-ui, sans-serif; }
  .app { max-width: 1000px; margin: 0 auto; padding: 18px 12px 48px; }
  h1 { margin: 0 0 4px; font-size: clamp(1.7rem, 5.5vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .lead { margin: 0 0 12px; color: var(--muted); max-width: 66ch; font-size: .95rem; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button { font: inherit; }

  .stage { position: relative; border-radius: 20px; overflow: hidden; background: #04061a; }
  .stage.fs { position: fixed; inset: 0; z-index: 100; border-radius: 0; }
  canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
  .hud { position: absolute; left: 10px; top: 10px; padding: 4px 12px; border-radius: 999px; pointer-events: none;
    background: rgba(13,18,48,.7); color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .hud b { color: var(--chalk); font-weight: 700; }
  .fsbtn { position: absolute; right: 10px; top: 10px; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer;
    background: rgba(13,18,48,.7); color: var(--chalk); font-weight: 700; font-size: .8rem; }
  .toasts { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .toast { align-self: flex-start; max-width: 100%; padding: 6px 12px; border-radius: 12px; font-size: .86rem;
    background: rgba(22,28,69,.94); border: 1px solid var(--line); animation: tin .2s; }
  @keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .recbadge { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 3px 14px; border-radius: 999px; pointer-events: none;
    background: rgba(13,18,48,.82); font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; border: 1px solid var(--line); }
  .recbadge.live { color: var(--bad); border-color: var(--bad); }
  .recbadge.play { color: var(--cyan); border-color: var(--cyan); }
  .recst { margin: 10px 0 6px; color: var(--muted); font-size: .92rem; min-height: 1.4em; }
  .ver { font-size: .78rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
  .envbox { display: grid; gap: 8px; margin: 6px 0 10px; padding: 10px 12px; border-radius: 14px; background: var(--slot); }
  .envtitle { font-weight: 800; font-size: .92rem; }
  .envrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .86rem; color: var(--muted); }
  .envrow b { color: var(--chalk); font-variant-numeric: tabular-nums; }
  .envrow input { grid-column: 1 / -1; width: 100%; accent-color: var(--ok); }
  .envbtns { display: flex; flex-wrap: wrap; gap: 8px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; margin-bottom: 4px; }
  .sel { margin-top: 10px; padding: 12px 14px; border-radius: 18px; background: var(--panel); }
  .sel h2 { margin: 0 0 2px; font-size: 1.1rem; }
  .sel p { margin: 0 0 8px; color: var(--muted); font-size: .9rem; white-space: pre-line; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button { color: var(--muted); background: transparent; border: 0; padding: 7px 13px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: .9rem; }
  .seg button[aria-checked="true"] { background: var(--chalk); color: var(--ink); }
  .btn { color: var(--chalk); background: transparent; border: 2px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: .9rem; }
  .btn:hover { border-color: var(--focus); }
  .btn.primary { background: var(--sun); border-color: var(--sun); color: var(--ink); }
  .btn.danger:hover { border-color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .panel { background: var(--panel); border-radius: 20px; padding: 14px; margin-top: 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 1.05rem; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
  .tabs button { flex: none; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; font-weight: 700; font-size: .85rem; }
  .tabs button[aria-pressed="true"] { background: var(--chalk); color: var(--ink); border-color: var(--chalk); }
  .search { width: 100%; padding: 9px 14px; margin-bottom: 8px; border-radius: 999px; border: 2px solid var(--line);
    background: var(--slot); color: var(--chalk); font: inherit; }
  .cur { margin: 0 0 8px; color: var(--muted); font-size: .9rem; }
  .cur b { color: var(--sun); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; max-height: 40vh; overflow: auto; padding-right: 2px; }
  .it { display: flex; align-items: center; gap: 8px; text-align: left; padding: 7px 9px; border-radius: 14px; cursor: pointer;
    background: var(--slot); border: 2px solid var(--line); color: var(--chalk); font-size: .8rem; font-weight: 700; line-height: 1.2; }
  .it[aria-pressed="true"] { border-color: var(--sun); }
  .orb { flex: none; width: 22px; height: 22px; border-radius: 50%; }

  .set { display: grid; gap: 10px 18px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .set { grid-template-columns: 1fr 1fr; } }
  label.row { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .92rem; }
  label.row input[type=checkbox] { accent-color: var(--sun); width: 18px; height: 18px; flex: none; }
  label.sl { display: grid; gap: 4px; color: var(--muted); font-size: .92rem; }
  label.sl b { color: var(--chalk); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--sun); }
  select { font: inherit; font-weight: 700; color: var(--chalk); background: var(--slot); border: 2px solid var(--line); border-radius: 999px; padding: 7px 12px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }

  .modal { position: fixed; inset: 0; z-index: 200; background: rgba(4,6,26,.8); display: flex; align-items: center; justify-content: center; padding: 14px; }
  .modal > div { background: var(--panel); border-radius: 22px; padding: 18px; width: 100%; max-width: 560px; max-height: 86vh; overflow: auto; }
  .modal h2 { margin: 0 0 8px; }
  .modal ol { margin: 0 0 12px; padding-left: 1.4em; color: var(--muted); font-size: .92rem; }
  .modal ol li { margin-bottom: 3px; }
  .modal ul { margin: 0 0 12px; padding-left: 1.2em; color: var(--muted); font-size: .92rem; }
  textarea { width: 100%; min-height: 180px; background: var(--slot); color: var(--chalk); border: 2px solid var(--line); border-radius: 14px; padding: 10px; font: .8rem ui-monospace, monospace; }
  footer { margin-top: 24px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1 data-i18n="title"></h1>
    <span class="ver" id="verChip"></span>
    <div class="seg" role="radiogroup" data-i18n-aria="lblLang">
      <button type="button" role="radio" aria-checked="true" data-lang="en">English</button>
      <button type="button" role="radio" aria-checked="false" data-lang="id">Indonesia</button>
    </div>
  </div>
  <p class="lead" data-i18n="lead"></p>

  <div class="stage" id="stage">
    <canvas id="cv" data-i18n-aria="lblCanvas"></canvas>
    <div class="hud" id="hud"></div>
    <button class="fsbtn" id="fsBtn" type="button"></button>
    <div class="recbadge" id="recBadge" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </div>

  <div class="sel" id="selPanel" hidden>
    <h2 id="selName"></h2>
    <p id="selInfo"></p>
    <div class="envbox" id="envBox" hidden></div>
    <div class="acts">
      <button class="btn" id="aFollow" type="button"></button>
      <button class="btn" id="aBoom" type="button" data-i18n="boom"></button>
      <button class="btn" id="aBig" type="button" data-i18n="big"></button>
      <button class="btn" id="aSmall" type="button" data-i18n="small"></button>
      <button class="btn danger" id="aDel" type="button" data-i18n="del"></button>
      <button class="btn" id="aClose" type="button" data-i18n="close"></button>
    </div>
  </div>

  <div class="bar">
    <div class="seg" role="radiogroup" data-i18n-aria="lblMode">
      <button type="button" role="radio" aria-checked="true" data-mode="add" data-i18n="mAdd"></button>
      <button type="button" role="radio" aria-checked="false" data-mode="throw" data-i18n="mThrow"></button>
      <button type="button" role="radio" aria-checked="false" data-mode="select" data-i18n="mSelect"></button>
      <button type="button" role="radio" aria-checked="false" data-mode="delete" data-i18n="mDelete"></button>
    </div>
    <button class="btn primary" id="playBtn" type="button"></button>
    <button class="btn" id="zOut" type="button" data-i18n-aria="lblZoomOut">&minus;</button>
    <button class="btn" id="zIn" type="button" data-i18n-aria="lblZoomIn">+</button>
    <button class="btn" id="homeBtn" type="button" data-i18n="home"></button>
    <button class="btn" id="fitBtn" type="button" data-i18n="fitAll"></button>
    <button class="btn" id="undoBtn" type="button" data-i18n="undo"></button>
  </div>

  <section class="panel" id="recPanel">
    <h2 data-i18n="recTitle"></h2>
    <p class="lead" style="font-size:.9rem;margin-bottom:10px" data-i18n="recHint"></p>
    <div class="acts">
      <button class="btn danger" id="recStart" type="button" data-i18n="recStart"></button>
      <button class="btn" id="recPause" type="button"></button>
      <button class="btn" id="recStop" type="button" data-i18n="recStop"></button>
    </div>
    <div class="acts" style="margin-top:8px">
      <button class="btn primary" id="recPlay" type="button"></button>
      <button class="btn" id="recRew" type="button"></button>
      <button class="btn" id="recBack" type="button" data-i18n="recStepBack"></button>
      <button class="btn" id="recFwd" type="button" data-i18n="recStepFwd"></button>
    </div>
    <p class="recst" id="recStatus" aria-live="polite"></p>
    <input type="range" id="recSlider" min="0" max="0" step="1" value="0" style="width:100%;accent-color:var(--cyan)" data-i18n-aria="recSliderLbl">
    <div class="set" style="margin-top:10px">
      <label class="sl"><span data-i18n="recSpeed"></span>
        <select id="recSpd"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
      <label class="sl"><span data-i18n="recJump"></span>
        <select id="recEvents"></select></label>
    </div>
    <div class="acts" style="margin-top:10px">
      <button class="btn primary" id="recResumeHere" type="button" data-i18n="recResumeHere"></button>
      <button class="btn" id="recExit" type="button" data-i18n="recExit"></button>
      <button class="btn danger" id="recDiscard" type="button" data-i18n="recDiscard"></button>
    </div>
  </section>

  <section class="panel">
    <h2><span data-i18n="catalog"></span> <span id="catCount" style="color:var(--muted);font-weight:600"></span></h2>
    <div class="tabs" id="tabs" role="group"></div>
    <input class="search" id="search" type="search" data-i18n-ph="searchPh" data-i18n-aria="lblSearch">
    <p class="cur"><span data-i18n="selected"></span> <b id="curName"></b></p>
    <div class="grid" id="grid"></div>
  </section>

  <section class="panel">
    <h2 data-i18n="settings"></h2>
    <div class="set">
      <label class="sl"><span data-i18n="tSpeed"></span> <b id="spdTxt"></b>
        <input type="range" id="spd" min="0" max="11" step="1" value="3"></label>
      <label class="sl"><span data-i18n="tGrav"></span> <b id="gTxt">1.0×</b>
        <input type="range" id="gmul" min="0" max="3" step="0.1" value="1"></label>
      <label class="sl"><span data-i18n="tAge"></span> <b id="ageTxt"></b>
        <input type="range" id="age" min="0" max="6" step="1" value="2"></label>
      <label class="sl"><span data-i18n="tTrail"></span> <b id="tlTxt">120</b>
        <input type="range" id="tlen" min="0" max="400" step="10" value="120"></label>
      <div style="display:grid;gap:8px">
        <label class="row"><input type="checkbox" id="oReal" checked> <span data-i18n="oReal"></span></label>
        <label class="row"><input type="checkbox" id="oSnap"> <span data-i18n="oSnap"></span></label>
        <label class="row"><input type="checkbox" id="oArrows" checked> <span data-i18n="oArrows"></span></label>
        <label class="row"><input type="checkbox" id="oHz"> <span data-i18n="oHz"></span></label>
        <label class="row"><input type="checkbox" id="oFuel"> <span data-i18n="oFuel"></span></label>
        <label class="row"><input type="checkbox" id="oTrail" checked> <span data-i18n="oTrail"></span></label>
        <label class="row"><input type="checkbox" id="oLabel" checked> <span data-i18n="oLabel"></span></label>
        <label class="row"><input type="checkbox" id="oGrid"> <span data-i18n="oGrid"></span></label>
        <label class="row"><input type="checkbox" id="oAuto" checked> <span data-i18n="oAuto"></span></label>
        <label class="row"><input type="checkbox" id="oCol" checked> <span data-i18n="oCol"></span></label>
        <label class="row"><input type="checkbox" id="oSnd"> <span data-i18n="oSnd"></span></label>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2 data-i18n="scen"></h2>
    <div class="acts">
      <select id="preset" data-i18n-aria="lblPreset">
        <option value="solar" data-i18n="pSolar"></option>
        <option value="real" data-i18n="pReal"></option>
        <option value="binary" data-i18n="pBin"></option>
        <option value="bh" data-i18n="pBh"></option>
        <option value="shower" data-i18n="pShower"></option>
        <option value="nova" data-i18n="pNova"></option>
        <option value="belt" data-i18n="pBelt"></option>
        <option value="galaxy" data-i18n="pGal"></option>
      </select>
      <button class="btn primary" id="loadPreset" type="button" data-i18n="loadPreset"></button>
      <button class="btn" id="randBtn" type="button" data-i18n="randBtn"></button>
      <button class="btn danger" id="clearBtn" type="button" data-i18n="clearBtn"></button>
    </div>
    <div class="acts" style="margin-top:8px">
      <button class="btn" id="expBtn" type="button" data-i18n="expBtn"></button>
      <button class="btn" id="impBtn" type="button" data-i18n="impBtn"></button>
      <button class="btn" id="shotBtn" type="button" data-i18n="shotBtn"></button>
      <button class="btn" id="helpBtn" type="button" data-i18n="helpBtn"></button>
    </div>
  </section>

  <p class="lead" style="margin-top:14px;font-size:.85rem" data-i18n="footNote"></p>
  <footer><span data-i18n="footer"></span> · <b id="verTxt"></b></footer>
</main>

<div class="modal" id="ioModal" hidden>
  <div>
    <h2 id="ioTitle"></h2>
    <p class="lead" id="ioHint"></p>
    <textarea id="ioText" spellcheck="false"></textarea>
    <div class="acts" style="margin-top:10px">
      <button class="btn primary" id="ioCopy" type="button" data-i18n="ioCopy"></button>
      <button class="btn" id="ioLoad" type="button" data-i18n="ioLoad"></button>
      <button class="btn" id="ioClose" type="button" data-i18n="ioClose"></button>
    </div>
  </div>
</div>

<div class="modal" id="helpModal" hidden>
  <div>
    <h2 data-i18n="helpTitle"></h2>
    <p class="lead" id="verInfo" style="font-size:.88rem"></p>
    <ul>
      <li data-i18n="h1"></li>
      <li data-i18n="h2"></li>
      <li data-i18n="h3"></li>
      <li data-i18n="h4"></li>
      <li data-i18n="h5"></li>
    </ul>
    <h2 id="featTitle"></h2>
    <ol id="featList"></ol>
    <button class="btn primary" id="helpClose" type="button" data-i18n="helpClose"></button>
  </div>
</div>

      const a = rand(0, TAU), c0 = s ? circ(s, x, y).d : rand(80, 300), d = c0 + rand(-18, 18);
      const px = (s ? s.x : 0) + Math.cos(a) * d, py = (s ? s.y : 0) - Math.sin(a) * d;
      let v = [0, 0];
      if (s) { const cc = circ(s, px, py); v = opt.auto ? [s.vx + cc.tx * cc.v, s.vy + cc.ty * cc.v] : [s.vx, s.vy]; }
      bodies.push(makeBody(Object.assign({}, base, { r: base.r * rand(0.6, 1.4) }), px, py, v[0], v[1]));
    }
  } else {
    let ux = 1, uy = 0, sv = [0, 0];
    if (s) { const c = circ(s, x, y); ux = -c.ux; uy = -c.uy; sv = [s.vx, s.vy]; }
    const px = -uy, py = ux;
    for (let i = 0; i < n; i++) {
      const off = rand(-60, 60), al = rand(-25, 25), sp = rand(110, 150);
      bodies.push(makeBody(Object.assign({}, base, { r: base.r * rand(0.7, 1.3) }), x + px * off + ux * al, y + py * off + uy * al,
        sv[0] + ux * sp + px * rand(-6, 6), sv[1] + uy * sp + py * rand(-6, 6)));
    }
  }
  refreshSrcs();
  return true;
}

function spawnItem(it, x, y, vel) {
  if (it.k === 'nova') {
    const tgt = srcs.find(s => s.gm > 0 && s.k !== 'bh' && Math.hypot(s.x - x, s.y - y) <= s.r + 10);
    if (tgt) { explode(tgt, it.ex.boom); return tgt; }
  }
  if (it.k === 'gal') return spawnGalaxy(it, x, y, vel);
  if (it.k === 'evt') return spawnEvt(it, x, y);
  if (it.k === 'part') return spawnParticles(it, x, y, vel);
  if (it.ex.group) return spawnGroup(it, x, y);
  if (it.k === 'moon' || it.k === 'sat') return spawnRail(it, x, y);
  let v = vel, ro = null;
  if (!v) { ro = realOrbit(it, x, y); if (ro) { x = ro.x; y = ro.y; v = ro.v; } }
  if (!v) v = initVel(it, x, y);
  const b = makeBody(it, x, y, v[0], v[1]);
  if (ro) note(T('realOrbit', dn(it.name), ro.au, ro.e), 'real');
  bodies.push(b);
  refreshSrcs();
  return b;
}

/* ---- efek ---- */
function spawnParts(x, y, n, spd, col, life, size) {
  for (let i = 0; i < n && parts.length < 2000; i++) {
    const a = rand(0, TAU), s = rand(0.3, 1) * spd;
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: life * rand(0.6, 1), m: life, c: col, s: size });
  }
}
function flash(x, y, size, col) {
  blasts.push({ x: x, y: y, t: 0, dur: 0.7, R: size * 3, type: 'flash', col: col, hit: new Set() });
  spawnParts(x, y, 10, 40, col, 0.8, 1.5);
}

function explode(b, type) {
  const cfg = {
    II: { R: 300, dur: 5, col: '#9ac0ff', rem: 'Bintang neutron' },
    Ia: { R: 340, dur: 4.5, col: '#fff2c8', rem: null },
    hyper: { R: 560, dur: 6, col: '#d0a8ff', rem: 'Lubang hitam stellar' },
    kilo: { R: 220, dur: 4, col: '#ffb870', rem: 'Lubang hitam mini' },
    grb: { R: 0, dur: 1.8, col: '#8affea', rem: 'Lubang hitam mini' }
  }[type || 'II'] || { R: 300, dur: 5, col: '#9ac0ff', rem: 'Bintang neutron' };
  const cx = b.x, cy = b.y, vx = b.vx, vy = b.vy, nm = b.name;
  removeBody(b);
  const bl = { x: cx, y: cy, t: 0, dur: cfg.dur, R: cfg.R, type: type || 'II', col: cfg.col, hit: new Set(), ang: rand(0, TAU) };
  blasts.push(bl);
  refreshSrcs();
  if (cfg.rem) {
    const r = spawnItem(CATALOG[BY_NAME[cfg.rem]], cx, cy, [vx, vy]);
    if (r && r.id) bl.hit.add(r.id);
  }
  if (cfg.R > 0) {
    const nb = makeBody(CATALOG[BY_NAME['Nebula Kepiting (sisa supernova)']], cx, cy, 0, 0);
    nb.r = 10; nb.grow = cfg.R * 0.12; nb.c1 = cfg.col; bodies.push(nb); bl.hit.add(nb.id);
  }
  spawnParts(cx, cy, 70, cfg.R > 0 ? 160 : 90, cfg.col, 1.6, 2);
  note(T(type === 'grb' ? 'boomGrb' : 'boomNova', dn(nm)), 'boom');
  hooks.sfx('boom');
}

function updateBlasts(dt) {
  for (const bl of blasts) {
    bl.t += dt;
    if (bl.type === 'flash') continue;
    const p = Math.min(1, bl.t / bl.dur);
    if (bl.type === 'grb') {
      const ca = Math.cos(bl.ang), sa = Math.sin(bl.ang);
      for (const b of bodies) {
        if (b.dead || b.anchor || b.rail || bl.hit.has(b.id)) continue;
        const dx = b.x - bl.x, dy = b.y - bl.y;
        if (Math.abs(dx * sa - dy * ca) < 8 + b.r) {
          bl.hit.add(b.id);
          if (b.k === 'bh') continue;
          removeBody(b); flash(b.x, b.y, 8, '#8affea');
        }
      }
      continue;
    }
    if (bl.type === 'shock' || bl.type === 'gw') {
      const Rg = bl.R * (bl.type === 'gw' ? p : 1 - Math.pow(1 - p, 2));
      for (const b of bodies) {
        if (b.dead || b.anchor || b.rail || bl.hit.has(b.id)) continue;
        const dx = b.x - bl.x, dy = b.y - bl.y, d = Math.hypot(dx, dy) || 1;
        if (d > Rg + b.r) continue;
        bl.hit.add(b.id);
        if (b.k === 'neb' || b.k === 'dm') continue;
        const f = (bl.type === 'gw' ? 8 : 40) * (1 - d / bl.R) * (b.gm !== 0 ? 0.2 : 1);
        if (bl.type === 'gw') { const sg = Math.random() < 0.5 ? -1 : 1; b.vx += dx / d * f * sg; b.vy += dy / d * f * sg; }
        else {
          b.vx += dx / d * f; b.vy += dy / d * f;
          if (b.k === 'plan' || b.k === 'moon') getEnv(b).heat += 20 * (1 - d / bl.R);
        }
      }
      continue;
    }
    const Rc = bl.R * (1 - Math.pow(1 - p, 2));
    for (const b of bodies) {
      if (b.dead || b.anchor || b.rail || bl.hit.has(b.id)) continue;
      const dx = b.x - bl.x, dy = b.y - bl.y, d = Math.hypot(dx, dy) || 1;
      if (d > Rc + b.r) continue;
      bl.hit.add(b.id);
      if (b.k === 'neb') continue;
      if (b.gm !== 0) { b.vx += dx / d * 18 * (1 - d / bl.R); b.vy += dy / d * 18 * (1 - d / bl.R); }
      else if (b.free) continue;
      else if (d < bl.R * 0.55) { removeBody(b); flash(b.x, b.y, 6, '#ffb870'); }
      else { const f = 90 * (1 - d / bl.R) + 25; b.vx += dx / d * f; b.vy += dy / d * f; }
    }
  }
  blasts = blasts.filter(bl => bl.t < bl.dur + 0.2);
}
function updateParts(dt) {
  const d = Math.min(dt, 0.1);
  for (const p of parts) { p.x += p.vx * d; p.y += p.vy * d; p.l -= d; }
  parts = parts.filter(p => p.l > 0);
}

/* ---- fisika ---- */
function absorb(s, b) {
  removeBody(b);
  if (s.k === 'bh') {
    s.gm += MU * 0.0004 * b.r * b.r;
    s.r = Math.min(s.r0 * 2.2, s.r + 0.02 * b.r);
    spawnParts(b.x, b.y, 6, 30, s.c2, 0.8, 1.4);
    note(T('swallowed', dn(b.name), dn(s.name)), 'absorb');
    hooks.sfx('absorb');
  } else {
    flash(b.x, b.y, Math.min(10, 3 + b.r), '#ffb060');
    note(T('fell', dn(b.name), dn(s.name)), 'fall');
  }
}

function substep(h, map) {
  const G = opt.gmul;
  for (const b of bodies) {
    if (b.dead) continue;
    if (b.rail) {
      const p = map.get(b.parent);
      if (p && !p.dead) { b.ang += b.w * h; applyRail(b, p); }
      continue;
    }
    if (b.free) {
      if (b.hd !== undefined) {
        b.hd += (Math.random() - 0.5) * 4 * h;
        if (Math.hypot(b.x, b.y) > 1500) b.hd = Math.atan2(-b.y, -b.x);
        b.vx = Math.cos(b.hd) * b.spd; b.vy = Math.sin(b.hd) * b.spd;
      }
      b.x += b.vx * h; b.y += b.vy * h;
      continue;
    }
    if (b.anchor) continue;
    let ax = 0, ay = 0;
    for (const s of srcs) {
      if (s === b) continue;
      const dx = s.x - b.x, dy = s.y - b.y, d2 = dx * dx + dy * dy + 0.09 * s.r * s.r + 9;
      const inv = G * s.gm / (d2 * Math.sqrt(d2));
      ax += dx * inv; ay += dy * inv;
    }
    b.vx += ax * h; b.vy += ay * h;
    b.x += b.vx * h; b.y += b.vy * h;
  }
  for (const s of srcs) {
    if (s.dead || s.gm <= 0 || s.k === 'dm') continue;
    const rad = s.k === 'bh' ? s.r * 1.15 : s.r * 0.8;
    for (const b of bodies) {
      if (b === s || b.dead || b.rail || b.free || b.gm !== 0) continue;
      const dx = b.x - s.x, dy = b.y - s.y, rr = rad + b.r * 0.3;
      if (dx * dx + dy * dy < rr * rr) absorb(s, b);
    }
  }
}

function mergeSources() {
  for (let i = 0; i < srcs.length; i++) {
    const a = srcs[i];
    if (a.dead || a.gm <= 0 || a.k === 'dm') continue;
    for (let j = i + 1; j < srcs.length; j++) {
      const c = srcs[j];
      if (c.dead || c.gm <= 0 || c.k === 'dm') continue;
      if (Math.hypot(a.x - c.x, a.y - c.y) > (a.r + c.r) * 0.6) continue;
      const big = a.gm >= c.gm ? a : c, sm = big === a ? c : a;
      if (a.k === 'ns' && c.k === 'ns') { explode(big, 'kilo'); removeBody(sm); return; }
      const tot = big.gm + sm.gm;
      if (!big.anchor) { big.vx = (big.vx * big.gm + sm.vx * sm.gm) / tot; big.vy = (big.vy * big.gm + sm.vy * sm.gm) / tot; }
      big.gm = tot;
      if (big.k !== 'bh') big.r = Math.min(120, Math.cbrt(big.r * big.r * big.r + sm.r * sm.r * sm.r));
      removeBody(sm); flash(sm.x, sm.y, 10, big.c2);
      note(T('mergedWith', dn(sm.name), dn(big.name)), 'merge');
    }
  }
}

function resolve(a, c) {
  const A = a.r * a.r, B = c.r * c.r, big = A >= B ? a : c, sm = big === a ? c : a;
  const rel = Math.hypot(a.vx - c.vx, a.vy - c.vy);
  if (sm.k === 'met' || Math.max(A, B) / Math.min(A, B) >= 6) {
    flash(sm.x, sm.y, Math.min(14, 4 + sm.r * 2), '#ffd890');
    if (sm.ex.burst) flash(sm.x, sm.y, 16, '#ffb060');
    removeBody(sm);
    note(T('hitBody', dn(sm.name), dn(big.name)), 'hit');
    hooks.sfx('blip');
  } else if (rel > 70) {
    flash(a.x, a.y, 12, '#ffb870');
    spawnParts(a.x, a.y, 24, 70, '#ffb870', 1.2, 1.6);
    removeBody(a); removeBody(c);
    note(T('crash', dn(a.name), dn(c.name)), 'crash');
    hooks.sfx('boom');
  } else {
    big.vx = (a.vx * A + c.vx * B) / (A + B); big.vy = (a.vy * A + c.vy * B) / (A + B);
    big.x = (a.x * A + c.x * B) / (A + B); big.y = (a.y * A + c.y * B) / (A + B);
    big.r = Math.sqrt(A + B) * 0.97;
    removeBody(sm); flash(big.x, big.y, 6, '#ffe0b0');
    note(T('merged2', dn(a.name), dn(c.name)), 'merge2');
  }
}
function collide() {
  if (!opt.collide) return;
  const L = bodies.filter(b => !b.dead && !b.rail && b.gm === 0 && !b.free && !b.noCol);
  for (let i = 0; i < L.length; i++) {
    const a = L[i];
    if (a.dead) continue;
    for (let j = i + 1; j < L.length; j++) {
      const c = L[j];
      if (c.dead) continue;
      const dx = a.x - c.x, dy = a.y - c.y, rr = a.r + c.r;
      if (dx * dx + dy * dy > rr * rr) continue;
      resolve(a, c);
      if (a.dead) break;
    }
  }
}

function perFrame(dt, map) {
  evolveStars(dt);
  for (const b of bodies) {
    if (b.dead) continue;
    b.age += dt; b.rot += b.spin * dt;
    if (b.fuse !== undefined) { b.fuse -= dt; if (b.fuse <= 0) { explode(b, b.boom); continue; } }
    if (b.k === 'met') { b.life -= dt; if (b.life <= 0) { if (b.ex.burst) flash(b.x, b.y, 16, '#ffd890'); b.dead = true; } }
    if (b.grow) b.r += b.grow * dt;
    if (b.tp > 0) b.tp -= dt;
    if (b.k === 'part') { b.life -= dt; if (b.life <= 0) b.dead = true; }
    if (b.env) { b.env.heat *= Math.exp(-dt / 40); b.env.rad *= Math.exp(-dt / 400); }
    if (b.act) b.act *= Math.exp(-dt / 10);
    if (b.gm === 0 && !b.rail && (b.k === 'plan' || b.k === 'ast' || b.k === 'comet' || b.k === 'probe' || b.k === 'moon') && !b.esc && Math.hypot(b.x, b.y) > 1500) {
      const oi = orbitInfo(b);
      if (oi && !oi.bound) { b.esc = true; note(T('escaped', dn(b.name)), 'esc' + b.id); }
    }
    if (b.gm === 0 && (Math.abs(b.x) > 3000000 || Math.abs(b.y) > 3000000)) { b.dead = true; note(T('lostFar', dn(b.name)), 'lost'); }
  }
  mergeSources();
  collide();
  particleHits();
  for (const w of bodies) {
    if (w.dead || w.k !== 'fx' || !w.ex.worm) continue;
    for (const b of bodies) {
      if (b.dead || b.rail || b.free || b.gm !== 0 || b.tp > 0) continue;
      if (Math.hypot(b.x - w.x, b.y - w.y) < w.r * 0.8) {
        const a = rand(0, TAU), d = rand(200, 500);
        b.x = Math.cos(a) * d; b.y = Math.sin(a) * d; b.tp = 2; b.trail = [];
        flash(b.x, b.y, 5, '#8affea');
        note(T('wormOut', dn(b.name)), 'worm');
      }
    }
  }
  updateBlasts(dt);
  updateParts(dt);
  trailAcc += dt;
  if (trailAcc >= 0.1) {
    trailAcc = 0;
    const cap = Math.max(0, opt.trailLen) * 2;
    for (const b of bodies) {
      if (b.dead) continue;
      if (!opt.trails || cap === 0 || b.k === 'met' || b.k === 'neb' || b.k === 'part' || b.k === 'gstar') { if (b.trail.length) b.trail.length = 0; continue; }
      b.trail.push(b.x, b.y);
      if (b.trail.length > cap) b.trail.splice(0, b.trail.length - cap);
    }
  }
  for (const b of bodies) if (b.rail && !b.dead) { const p = map.get(b.parent); if (!p || p.dead) b.dead = true; }
  compact();
  refreshSrcs();
}

function step(dt) {
  if (!(dt > 0)) return;
  const map = new Map();
  for (const b of bodies) map.set(b.id, b);
  let maxGm = 0;
  for (const s of srcs) maxGm = Math.max(maxGm, Math.abs(s.gm));
  let h = (1 / 120) / (1 + Math.floor(maxGm / (MU * 20)));
  let n = Math.ceil(dt / h);
  if (n > 600) n = 600;
  h = dt / n;
  for (let i = 0; i < n; i++) substep(h, map);
  simT += dt;
  perFrame(dt, map);
}

function predict(x, y, vx, vy) {
  const pts = [x, y], h = 1 / 30;
  for (let i = 0; i < 360; i++) {
    let ax = 0, ay = 0;
    for (const s of srcs) {
      const dx = s.x - x, dy = s.y - y, d2 = dx * dx + dy * dy + 0.09 * s.r * s.r + 9;
      const inv = opt.gmul * s.gm / (d2 * Math.sqrt(d2));
      ax += dx * inv; ay += dy * inv;
      const rad = s.k === 'bh' ? s.r * 1.15 : s.r * 0.8;
      if (s.gm > 0 && dx * dx + dy * dy < rad * rad) { pts.push(x, y); return pts; }
    }
    vx += ax * h; vy += ay * h; x += vx * h; y += vy * h;
    if (i % 3 === 0) pts.push(x, y);
  }
  return pts;
}

function orbitInfo(b) {
  const s = dominant(b.x, b.y);
  if (!s || s === b) return null;
  const rx = b.x - s.x, ry = b.y - s.y, vx = b.vx - s.vx, vy = b.vy - s.vy;
  const r = Math.hypot(rx, ry) || 1, v2 = vx * vx + vy * vy, mu = opt.gmul * s.gm;
  const inv = 2 / r - v2 / mu, rv = rx * vx + ry * vy;
  const ex = (v2 / mu - 1 / r) * rx - rv / mu * vx, ey = (v2 / mu - 1 / r) * ry - rv / mu * vy;
  const a = 1 / inv;
  return { s: s, r: r, a: a, e: Math.hypot(ex, ey), bound: inv > 0, T: inv > 0 ? TAU * Math.sqrt(a * a * a / mu) : 0 };
}

const ATM_F = { n2o2: 1, dense: 0.5, thin: 0.4, trace: 0.15, none: 0.08, co2: 0.05, h2he: 0, unknown: 0.6 };

function teqK(L, rUnits) { return 254.3 * Math.pow(L, 0.25) / Math.sqrt(rUnits / AU); }
function starLifeSim(b) { return Math.min(1e6, Math.max(120, 10 * Math.pow(b.m0, -2.5) / opt.ageRate)); }
function initStar(b, it) {

}
function updRec() {
  const n = rec.frames.length, idle = rec.state === 'idle', len = fmtClock(recLenS());
  $('recPause').textContent = T(rec.state === 'paused' ? 'recResume' : 'recPause');
  $('recPause').disabled = idle; $('recStop').disabled = idle;
  $('recPlay').textContent = T(pb.active && pb.playing && pb.dir > 0 ? 'recPlayPause' : 'recPlay');
  $('recRew').textContent = T(pb.active && pb.playing && pb.dir < 0 ? 'recPlayPause' : 'recRew');
  ['recPlay', 'recRew', 'recBack', 'recFwd', 'recSlider', 'recSpd', 'recEvents'].forEach(id => { $(id).disabled = n < 2; });
  $('recResumeHere').disabled = !pb.active; $('recExit').disabled = !pb.active; $('recDiscard').disabled = n === 0 && idle;
  $('recSlider').max = Math.max(0, n - 1);
  $('recSlider').value = Math.round(pb.active ? pb.pos : Math.max(0, n - 1));
  let st;
  if (rec.state === 'recording') st = T('recRecording', len, n);
  else if (rec.state === 'paused') st = T('recPausedS', len);
  else if (n > 1) st = pb.active ? T('recPlaying', fmtClock(pb.pos / REC_FPS), len) : T('recReady', len);
  else st = T('recIdle');
  if (rec.dropped) st += ' ' + T('recLimit');
  $('recStatus').textContent = st;
  const bd = $('recBadge');
  if (pb.active) { bd.hidden = false; bd.className = 'recbadge play'; bd.textContent = T(pb.playing && pb.dir < 0 ? 'bRew' : 'bPlay', fmtClock(pb.pos / REC_FPS), len); }
  else if (rec.state === 'recording') { bd.hidden = false; bd.className = 'recbadge live'; bd.textContent = T('bRec', len); }
  else if (rec.state === 'paused') { bd.hidden = false; bd.className = 'recbadge live'; bd.textContent = T('bPaused'); }
  else bd.hidden = true;
}
function startRec() {
  pbExit(); recReset(); rec.state = 'recording'; recAcc = 0; recCapture();
  hooks.toast(T('tRecStart')); rebuildEvents(); updRec();
}
function pauseRec() {
  if (rec.state === 'recording') { rec.state = 'paused'; hooks.toast(T('tRecPause')); }
  else if (rec.state === 'paused') { rec.state = 'recording'; hooks.toast(T('tRecResume')); }
  updRec();
}
function stopRec() {
  if (rec.state === 'idle') return;
  if (rec.state === 'recording') recCapture();
  rec.state = 'idle'; pb.fresh = true;
  hooks.toast(T('tRecStop', fmtClock(recLenS()))); rebuildEvents(); updRec();
}
function ensurePlayback() {
  if (rec.frames.length < 2) { hooks.toast(T('tRecEmpty')); return false; }
  if (rec.state !== 'idle') stopRec();
  pbEnter(); frameMaps.clear();
  return true;
}
$('recStart').addEventListener('click', startRec);
$('recPause').addEventListener('click', pauseRec);
$('recStop').addEventListener('click', stopRec);
$('recPlay').addEventListener('click', () => {
  if (!ensurePlayback()) return;
  if (pb.playing && pb.dir > 0) pb.playing = false;
  else { if (pb.pos >= rec.frames.length - 1) pb.pos = 0; pb.dir = 1; pb.playing = true; }
  updRec();
});
$('recRew').addEventListener('click', () => {
  if (!ensurePlayback()) return;
  if (pb.playing && pb.dir < 0) pb.playing = false;
  else { if (pb.pos <= 0) pb.pos = rec.frames.length - 1; pb.dir = -1; pb.playing = true; }
  updRec();
});
const recStep = d => { if (!ensurePlayback()) return; pb.playing = false; pb.pos = clamp(pb.pos + d * REC_FPS, 0, rec.frames.length - 1); updRec(); };
$('recBack').addEventListener('click', () => recStep(-1));
$('recFwd').addEventListener('click', () => recStep(1));
$('recSlider').addEventListener('input', e => { if (!ensurePlayback()) return; pb.playing = false; pb.pos = clamp(+e.target.value, 0, rec.frames.length - 1); updRec(); });
$('recSpd').addEventListener('change', e => { pb.speed = +e.target.value || 1; });
$('recEvents').addEventListener('change', e => {
  const v = e.target.value;
  if (v === '' || v === undefined) return;
  if (!ensurePlayback()) return;
  pb.playing = false; pb.pos = clamp(+v - 5 * REC_FPS, 0, rec.frames.length - 1);
  e.target.value = ''; updRec();
});
$('recResumeHere').addEventListener('click', () => {
  if (!pb.active) return;
  recRestoreAt(pb.pos); undo = []; selId = null; showSel(); hooks.toast(T('tResumed')); updRec();
});
$('recExit').addEventListener('click', () => { pbExit(); selId = null; showSel(); updRec(); });
$('recDiscard').addEventListener('click', () => { pbExit(); recReset(); hooks.toast(T('tDiscarded')); rebuildEvents(); updRec(); });

/* ---- loop ---- */
function simDate() {
  const yrs = simT / YEAR;
  if (yrs > 200000) return T('yearsPlus', Math.round(yrs).toLocaleString(lang === 'en' ? 'en-US' : 'id-ID'));
  return new Date(Date.UTC(2026, 0, 1) + yrs * 365.25 * 86400000).toLocaleDateString(lang === 'en' ? 'en-US' : 'id-ID', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}
let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 60, hudT = 0;
function frame(ts) {
  const dtr = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts; clock += dtr;
  fpsAcc += dtr; fpsN++;
  if (fpsAcc >= 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  if (pb.active) {
    if (pb.playing) {
      pb.pos += pb.dir * pb.speed * dtr * REC_FPS;
      const n = rec.frames.length;
      if (pb.pos >= n - 1) { pb.pos = n - 1; pb.playing = false; updRec(); }
      else if (pb.pos <= 0) { pb.pos = 0; pb.playing = false; updRec(); }
    }
    pbBuild(pb.pos);
  } else if (!paused) step(dtr * SPEEDS[speedIdx]);
  if (rec.state === 'recording' && !paused && !pb.active) {
    recAcc += dtr;
    while (recAcc >= 1 / REC_FPS) { recAcc -= 1 / REC_FPS; recCapture(); }
  }
  if (cam.follow) {
    const f = bodies.find(b => b.id === cam.follow && !b.dead);
    if (f) { const k = 1 - Math.exp(-dtr * 8); cam.x += (f.x - cam.x) * k; cam.y += (f.y - cam.y) * k; } else cam.follow = null;
  }
  if (selId && !selBody()) { selId = null; showSel(); }
  render();
  hudT += dtr;
  if (hudT > 0.25) {
    hudT = 0;
    $('hud').innerHTML = T('hudObj') + ' <b>' + bodies.length + '</b> · ' + T('hudFps') + ' <b>' + fps + '</b> · <b>' + simDate() + '</b>';
    if (selId) showSel();
    updRec();
  }
  requestAnimationFrame(frame);
}

/* ---- bahasa / language ---- */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = T('title');
  $('verChip').textContent = APP_VERSION; $('verTxt').textContent = APP_VERSION; $('verInfo').textContent = T('verInfo', APP_VERSION);
  envKey = '';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', T(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.lang === lang)));
  $('playBtn').textContent = T(paused ? 'play' : 'pause');
  $('fsBtn').textContent = T(stage.classList.contains('fs') ? 'exitFs' : 'fs');
  $('catCount').textContent = '(' + VISIBLE.length + ' ' + T('objWord') + ')';
  $('curName').textContent = dn(CATALOG[cur].name);
  $('gTxt').textContent = fmtNum(opt.gmul, 1) + '×';
  buildFeat(); buildTabs(); buildGrid(); updSpd(); updAge(); rebuildEvents(); updRec(); showSel();
}
function setLang(l) {
  lang = l === 'id' ? 'id' : 'en';
  try { localStorage.setItem('sandboxLang', lang); } catch (_) { /* penyimpanan tidak tersedia */ }
  applyLang();
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
try { const saved = localStorage.getItem('sandboxLang'); if (saved === 'id' || saved === 'en') lang = saved; } catch (_) { /* default English */ }

resize();
clearAll(); addSun();
cam.z = fit();
applyLang();
hooks.toast(T('tHint'));
requestAnimationFrame(frame);
/*UI_END*/
})();
</script>
